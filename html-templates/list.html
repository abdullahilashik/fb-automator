<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealerCore Status Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-gray-200 flex justify-center">

    <div x-data="vehicleDashboard()" class="w-[380px] h-screen bg-white flex flex-col overflow-hidden shadow-xl">

        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 bg-sky-600 rounded-full flex items-center justify-center">
                    <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                        <path
                            d="M10 2a8 8 0 100 16 8 8 0 000-16zM7 9a1 1 0 112 0 1 1 0 01-2 0zm4 0a1 1 0 112 0 1 1 0 01-2 0z" />
                    </svg>
                </div>
                <span class="text-base tracking-tight">
                    <span class="font-bold text-gray-800">Dealer</span><span
                        class="font-medium text-gray-500">Core</span>
                </span>
            </div>
            <div class="flex items-center gap-3 text-gray-400">
                <button class="hover:text-gray-600"><svg class="w-4 h-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                    </svg></button>
                <div class="w-[1px] h-4 bg-gray-200"></div>
                <button class="hover:text-gray-600"><svg class="w-4 h-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg></button>
                <button class="hover:text-gray-600"><svg class="w-4 h-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg></button>
            </div>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-5">
            <h1 class="text-md font-bold text-gray-900 leading-tight">Select Vehicles</h1>
            <p class="text-[11px] text-gray-500 mt-1 mb-6">Choose the vehicles you want to advertise on Facebook.</p>

            <div class="flex justify-between items-center mb-4">
                <span class="text-[12px] text-gray-600" x-text="`${vehicles.length} vehicles available`"></span>
                <button @click="toggleAll()"
                    class="text-[12px] font-semibold text-blue-500 hover:text-blue-600 transition-colors">Select
                    all</button>
            </div>

            <div class="space-y-3">
                <template x-for="car in vehicles" :key="car.id">
                    <div class="relative border rounded-lg p-2 flex gap-3 transition-all cursor-pointer group"
                        :class="statusClasses(car.status)" @click="toggleCar(car.id)">

                        <!-- Checkbox -->
                        <div class="flex items-start pt-1">
                            <div :class="car.selected ? 'bg-sky-500 border-sky-500' : 'bg-white border-gray-300'"
                                class="w-4 h-4 border rounded flex items-center justify-center transition-all">
                                <svg x-show="car.selected" class="w-2.5 h-2.5 text-white" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                        d="M5 13l4 4L19 7" />
                                </svg>
                            </div>
                        </div>

                        <!-- Image -->
                        <img :src="car.image" class="w-24 h-16 object-cover rounded-md bg-gray-50">

                        <!-- Details -->
                        <div class="flex-1 min-w-0 relative">
                            <div class="flex justify-between items-start">
                                <h3 class="text-[12px] font-bold text-gray-900 truncate" x-text="car.name"></h3>
                                <!-- Refresh Icon for Error State -->
                                <button x-show="car.status === 'error'"
                                    class="text-red-400 hover:text-red-600 p-1 bg-white rounded-full shadow-sm">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                    </svg>
                                </button>
                            </div>
                            <p class="text-[10px] text-gray-500 mb-0" x-text="car.trim"></p>
                            <p class="text-[12px] font-bold text-sky-500" x-text="car.price"></p>
                            <p class="text-[10px] text-gray-400 mt-0"
                                x-text="`${car.km} km • ${car.transmission} • ${car.fuel}`"></p>
                        </div>

                        <!-- Status Footer (Inside Card) -->
                        <div x-show="car.status !== 'default'" :class="statusFooterClasses(car.status)"
                            class="absolute bottom-0 left-0 right-0 px-3 py-4 flex justify-between items-center text-[11px] font-medium !mt-[4px]">
                            <div class="flex items-center gap-1.5">
                                <svg x-show="car.status === 'success'" class="w-3 h-3" fill="currentColor"
                                    viewBox="0 0 20 20">
                                    <path fill-rule="evenodd"
                                        d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                                        clip-rule="evenodd" />
                                </svg>
                                <svg x-show="car.status === 'error'" class="w-3 h-3" fill="currentColor"
                                    viewBox="0 0 20 20">
                                    <path fill-rule="evenodd"
                                        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                                        clip-rule="evenodd" />
                                </svg>
                                <span x-text="car.statusMessage"></span>
                            </div>
                            <span x-text="car.progress + '%'"></span>
                        </div>

                        <!-- Progress Bar (Processing State Only) -->
                        <div x-show="car.status === 'processing'"
                            class="absolute bottom-0 left-0 h-1 bg-sky-400 transition-all duration-500"
                            :style="`width: ${car.progress}%`"></div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Footer -->
        <div class="p-4 border-t border-gray-100 bg-white">
            <div class="flex justify-between items-center mb-3">
                <p class="text-[12px] font-medium text-gray-700">
                    <span x-text="selectedCount()"></span> vehicles selected
                </p>
                <button @click="clearSelection()"
                    class="text-xs font-semibold text-red-400 hover:text-red-500 transition-colors">Clear
                    selection</button>
            </div>
            <div class="space-y-2">
                <button
                    class="text-sm w-full bg-[#00a2e8] hover:bg-[#008bc9] text-white font-bold py-2 rounded-lg flex items-center justify-center gap-2 transition-all disabled:opacity-40"
                    :disabled="selectedCount() === 0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                    Publish
                </button>
                <button
                    class="text-sm w-full bg-white border border-gray-300 text-gray-700 font-semibold py-2 rounded-lg hover:bg-gray-50 transition-all">
                    Save as draft
                </button>
            </div>
        </div>
    </div>

    <script>
        function vehicleDashboard() {
            return {
                vehicles: [
                    { id: 1, name: '2023 Toyota Hilux', trim: 'SR', price: '$54,990', km: '42,000', transmission: 'Automatic', fuel: 'Diesel', image: 'https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&q=80&w=200', selected: true, status: 'success', statusMessage: 'Ad details filled', progress: 100 },
                    { id: 2, name: '2023 Toyota Hilux', trim: 'SR', price: '$54,990', km: '42,000', transmission: 'Automatic', fuel: 'Diesel', image: 'https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&q=80&w=200', selected: true, status: 'error', statusMessage: "Required fields couldn't be filled", progress: 95 },
                    { id: 3, name: '2021 Mazda CX-5', trim: 'Maxx Sport', price: '$39,990', km: '31,500', transmission: 'Automatic', fuel: 'Petrol', image: 'https://images.unsplash.com/photo-1533473359318-07198254e9da?auto=format&fit=crop&q=80&w=200', selected: true, status: 'processing', statusMessage: 'Processing:', progress: 85 },
                    { id: 4, name: '2022 Ford Ranger', trim: 'XLT', price: '$59,990', km: '28,000', transmission: 'Automatic', fuel: 'Diesel', image: 'https://images.unsplash.com/photo-1533473359318-07198254e9da?auto=format&fit=crop&q=80&w=200', selected: false, status: 'default', statusMessage: '', progress: 0 },
                    { id: 5, name: '2020 Toyota Corolla', trim: 'Ascent Sport', price: '$24,990', km: '51,000', transmission: 'CVT', fuel: 'Petrol', image: 'https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?auto=format&fit=crop&q=80&w=200', selected: false, status: 'default', statusMessage: '', progress: 0 },
                ],
                statusClasses(status) {
                    return {
                        'border-green-200 bg-green-50': status === 'success',
                        'border-red-200 bg-red-50': status === 'error',
                        'border-blue-200 bg-blue-50': status === 'processing',
                        'border-gray-200 bg-white': status === 'default',
                    }
                },
                statusFooterClasses(status) {
                    return {
                        'text-green-700': status === 'success',
                        'text-red-700': status === 'error',
                        'text-blue-700': status === 'processing',
                    }
                },
                toggleCar(id) {
                    const car = this.vehicles.find(v => v.id === id);
                    if (car) car.selected = !car.selected;
                },
                toggleAll() {
                    const allSelected = this.vehicles.every(v => v.selected);
                    this.vehicles.forEach(v => v.selected = !allSelected);
                },
                clearSelection() {
                    this.vehicles.forEach(v => v.selected = false);
                },
                selectedCount() {
                    return this.vehicles.filter(v => v.selected).length;
                }
            }
        }
    </script>
</body>

</html>
