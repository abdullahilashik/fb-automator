<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1/ encoding=UTF-8">
    <title>Dealercore Design Customizer Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        .skin-modern { font-family: 'Inter', sans-serif; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border: 1px solid #e5e7eb; }
        .skin-luxury { font-family: 'Playfair Display', serif; border-radius: 0px; border: 2px solid #d4af37; background: #fdfbf7; }
        .skin-budget { font-family: 'Inter', sans-serif; border-radius: 4px; border: 3px solid #ef4444; background: #fff; }
        .skin-dark { font-family: 'Inter', sans-serif; border-radius: 0.5rem; background: #1a1a1a; color: white; border: 1px solid #333; }
        .skin-minimal { font-family: 'Inter', sans-serif; border-radius: 0; border-bottom: 2px solid #000; background: transparent; }

        .layout-grid { display: flex; flex-direction: column; width: 300px; }
        .layout-list { display: flex; flex-direction: row; width: 500px; align-items: center; }
        .layout-compact { display: flex; flex-direction: column; width: 200px; font-size: 0.8rem; }

        .hidden-field { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <div class="flex h-screen">
        <!-- LEFT SIDEBAR: CONTROLS -->
        <div class="w-1/3 bg-white border-r p-8 overflow-y-auto">
            <h1 class="text-2xl font-bold mb-2">Showroom Customizer</h1>
            <p class="text-gray-500 mb-8">Adjust your vehicle display settings</p>

            <!-- 1. LAYOUT SELECTION -->
            <div class="mb-10">
                <label class="block text-sm font-semibold uppercase tracking-wider text-gray-600 mb-4">1. Choose Layout</label>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="updateLayout('grid')" class="layout-btn p-3 border-2 rounded-lg text-left hover:border-blue-500 transition bg-blue-50 border-blue-500" id="btn-grid">
                        <div class="font-bold">Grid View</div>
                        <div class="text-xs text-gray-500">Standard cards</div>
                    </button>
                    <button onclick="updateLayout('list')" class="layout-btn p-3 border-2 rounded-lg text-left hover:border-blue-500 transition" id="btn-list">
                        <div class="font-bold">List View</div>
                        <div class="text-xs text-gray-500">Horizontal rows</div>
                    </button>
                    <button onclick="updateLayout('compact')" class="layout-btn p-3 border-2 rounded-lg text-left hover:border-blue-500 transition" id="btn-compact">
                        <div class="font-bold">Compact</div>
                        <div class="text-xs text-gray-500">Small high-density</div>
                    </button>
                    <button onclick="updateLayout('featured')" class="layout-btn p-3 border-2 rounded-lg text-left hover:border-blue-500 transition" id="btn-featured">
                        <div class="font-bold">Featured</div>
                        <div class="text-xs text-gray-500">Hero layout</div>
                    </button>
                </div>
            </div>

            <!-- 2. SKIN SELECTION -->
            <div class="mb-10">
                <label class="block text-sm font-semibold uppercase tracking-wider text-gray-600 mb-4">2. Choose Design Skin</label>
                <div class="space-y-3">
                    <div onclick="updateSkin('modern')" class="skin-opt flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition bg-blue-50 border-blue-500" id="skin-modern">
                        <div class="w-6 h-6 rounded-full bg-blue-500 mr-3"></div>
                        <span class="font-medium">Modern (Clean & Soft)</span>
                    </div>
                    <div onclick="updateSkin('luxury')" class="skin-opt flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition" id="skin-luxury">
                        <div class="w-6 h-6 rounded-full bg-yellow-600 mr-3"></div>
                        <span class="font-medium">Luxury (Elegant & Sharp)</span>
                    </div>
                    <div onclick="updateSkin('budget')" class="skin-opt flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition" id="skin-budget">
                        <div class="w-6 h-6 rounded-full bg-red-500 mr-3"></div>
                        <span class="font-medium">Budget (Bold & Urgent)</span>
                    </div>
                    <div onclick="updateSkin('dark')" class="skin-opt flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition" id="skin-dark">
                        <div class="w-6 h-6 rounded-full bg-gray-800 mr-3"></div>
                        <span class="font-medium">Dark Mode (Sleek & Sporty)</span>
                    </div>
                    <div onclick="updateSkin('minimal')" class="skin-opt flex items-center p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition" id="skin-minimal">
                        <div class="w-6 h-6 rounded-full bg-gray-300 mr-3"></div>
                        <span class="font-medium">Minimalist (Pure & Simple)</span>
                    </div>
                </div>
            </div>

            <!-- 3. DATA TOGGLES -->
            <div class="mb-10">
                <label class="block text-sm font-semibold uppercase tracking-wider text-gray-600 mb-4">3. Display Options</label>
                <div class="space-y-3">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" checked onchange="toggleField('field-vin')" class="w-4 h-4 text-blue-600">
                        <span class="ml-3 text-gray-700">Show VIN Number</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" checked onchange="toggleField('field-mileage')" class="w-4 h-4 text-blue-600">
                        <span class="ml-3 text-gray-700">Show Mileage</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" checked onchange="toggleField('field-price')" class="w-4 h-4 text-blue-600">
                        <span class="ml-3 text-gray-700">Show Price</span>
                    </label>
                </div>
            </div>

            <button class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">Save Changes</button>
        </div>

        <!-- RIGHT SIDE: LIVE PREVIEW -->
        <div class="w-2/3 bg-gray-200 p-12 flex flex-col items-center justify-center relative">
            <div class="absolute top-8 left-8">
                <span class="bg-gray-800 text-white px-3 py-1 rounded-full text-xs font-bold uppercase">Live Preview</span>
            </div>

            <!-- THE DYNAMIC CARD -->
            <div id="preview-card" class="skin-modern layout-grid p-4 transition-all duration-300">
                <div id="card-img" class="w-full h-48 bg-gray-300 mb-4 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=400&q=80" class="w-full h-full object-cover">
                </div>
                <div id="card-content">
                    <h2 id="prev-title" class="text-xl font-bold mb-1">2023 Cadillac Escalade</h2>
                    <div id="field-price" class="text-blue-600 font-bold text-lg mb-3">$85,000</div>
                    
                    <div class="text-sm text-gray-600 space-y-1 mb-4">
                        <div id="field-vin" class="flex justify-between">
                            <span>VIN:</span> <span class="font-mono text-xs">1C3BM5S...</span>
                        </div>
                        <div id="field-mileage" class="flex justify-between">
                            <span>Mileage:</span> <span>1,200 mi</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Engine:</span> <span>6.2L V8</span>
                        </div>
                    </div>
                    
                    <button id="prev-btn" class="w-full py-2 bg-blue-600 text-white rounded font-semibold transition">Reserve Now</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateLayout(layout) {
            const card = document.getElementById('preview-card');
            card.className = ''; // Reset
            card.classList.add('p-4', 'transition-all', 'duration-300');
            
            // Apply layout class
            card.classList.add('layout-' + layout);
            
            // Fix layout-list image
            const img = document.getElementById('card-img');
            if(layout === 'list') {
                img.className = 'w-1/3 h-32 mr-4 mb-0 overflow-hidden';
            } else if (layout === 'compact') {
                img.className = 'w-full h-32 mb-2 overflow-hidden';
            } else {
                img.className = 'w-full h-48 mb-4 overflow-hidden';
            }

            // Update buttons
            document.querySelectorAll('.layout-btn').forEach(btn => btn.classList.remove('bg-blue-50', 'border-blue-500'));
            document.getElementById('btn-' + layout).classList.add('bg-blue-50', 'border-blue-500');
        }

        function updateSkin(skin) {
            const card = document.getElementById('preview-card');
            const btn = document.getElementById('prev-btn');
            
            // Remove all skin classes
            card.classList.remove('skin-modern', 'skin-luxury', 'skin-budget', 'skin-dark', 'skin-minimal');
            card.classList.add('skin-' + skin);

            // Update button color based on skin
            btn.className = 'w-full py-2 rounded font-semibold transition';
            if(skin === 'luxury') btn.classList.add('bg-yellow-600', 'text-white');
            else if(skin === 'budget') btn.classList.add('bg-red-600', 'text-white');
            else if(skin === 'dark') btn.classList.add('bg-cyan-400', 'text-black');
            else if(skin === 'minimal') btn.classList.add('border', 'border-black', 'text-black');
            else btn.classList.add('bg-blue-600', 'text-white');

            // Update selection UI
            document.querySelectorAll('.skin-opt').forEach(opt => opt.classList.remove('bg-blue-50', 'border-blue-500'));
            document.getElementById('skin-' + skin).classList.add('bg-blue-50', 'border-blue-500');
        }

        function toggleField(fieldId) {
            const field = document.getElementById(fieldId);
            field.classList.toggle('hidden-field');
        }
    </script>
</body>
</html>
