<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealerCore Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Smooth transition for the modal */
        .modal-enter { transition: opacity 0.3s ease-out, transform 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-200 flex justify-center">

    <!-- Side Panel Container -->
    <div x-data="{ showLogin: true, step: 'identify' }" class="w-[380px] h-screen bg-white flex flex-col overflow-hidden shadow-xl relative">
        
        <!-- BACKGROUND CONTENT (The page behind the modal) -->
        <div class="p-5 opacity-40 pointer-events-none">
            <h1 class="text-lg font-bold text-gray-900">Welcome to DealerCore</h1>
            <p class="text-sm text-gray-500 mb-4">Please login to access your vehicle dashboard and start posting to Facebook Marketplace.</p>
            <div class="space-y-3">
                <div class="h-20 bg-gray-100 rounded-lg"></div>
                <div class="h-20 bg-gray-100 rounded-lg"></div>
            </div>
        </div>

        <!-- MODAL OVERLAY -->
        <div x-show="showLogin" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             class="absolute inset-0 z-50 flex items-center justify-center p-6 bg-gray-900/60 backdrop-blur-sm">
            
            <!-- Modal Card -->
            <div class="bg-white w-full rounded-[32px] shadow-2xl overflow-hidden flex flex-col animate-in fade-in zoom-in duration-300">
                
                <!-- Modal Header -->
                <div class="p-8 pb-0 flex flex-col items-center text-center">
                    <div class="w-12 h-12 bg-sky-600 rounded-full flex items-center justify-center mb-4 shadow-lg shadow-sky-200">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Welcome Back</h2>
                    <p class="text-sm text-gray-500 mt-2" x-text="step === 'identify' ? 'Enter your details to receive an OTP' : 'Enter the code sent to your device'"></p>
                </div>

                <!-- Modal Body -->
                <div class="p-8 pt-6">
                    
                    <!-- STEP 1: Identify (Email/Phone) -->
                    <div x-show="step === 'identify'" x-transition class="space-y-5">
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 ml-1">Email or Phone Number</label>
                            <input type="text" 
                                   placeholder="e.g. name@email.com or +123..." 
                                   class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 outline-none transition-all text-sm">
                        </div>
                        
                        <button @click="step = 'verify'" 
                                class="w-full bg-[#00a2e8] hover:bg-[#008bc9] text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-sky-200 flex items-center justify-center gap-2">
                            Send OTP
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                        </button>
                    </div>

                    <!-- STEP 2: Verify (OTP) -->
                    <div x-show="step === 'verify'" x-transition class="space-y-6">
                        <div class="flex justify-center gap-3">
                            <!-- OTP Inputs -->
                            <template x-for="i in 4">
                                <input type="text" maxlength="1" 
                                       class="w-12 h-14 text-center text-xl font-bold rounded-xl border border-gray-200 focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 outline-none transition-all"
                                       oninput="if(this.value.length==1) this.nextElementSibling?.focus()">
                            </template>
                        </div>

                        <div class="space-y-3">
                            <button @click="showLogin = false" 
                                    class="w-full bg-[#00a2e8] hover:bg-[#008bc9] text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-sky-200">
                                Verify & Login
                            </button>
                            
                            <button @click="step = 'identify'" 
                                    class="w-full text-sm font-medium text-gray-400 hover:text-gray-600 transition-colors flex items-center justify-center gap-1">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                                Change email or phone
                            </button>
                        </div>

                        <div class="text-center">
                            <p class="text-xs text-gray-400">Didn't receive a code?</p>
                            <button class="text-xs font-bold text-sky-500 hover:text-sky-600 underline underline-offset-4">Resend OTP</button>
                        </div>
                    </div>

                </div>

                <!-- Modal Footer -->
                <div class="bg-gray-50 p-4 text-center border-t border-gray-100">
                    <p class="text-[11px] text-gray-400">
                        By logging in, you agree to DealerCore's <a href="#" class="underline">Terms of Service</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
