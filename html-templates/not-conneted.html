<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealerCore - Not Connected</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center">

    <!-- Side Panel Container -->
    <div class="w-[380px] h-screen bg-white flex flex-col overflow-hidden shadow-xl">
        
        <!-- Header (Consistent with previous screens) -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 bg-sky-600 rounded-full flex items-center justify-center">
                    <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16 8 8 0 000-16zM7 9a1 1 0 112 0 1 1 0 01-2 0zm4 0a1 1 0 112 0 1 1 0 01-2 0z"/></svg>
                </div>
                <span class="text-base tracking-tight">
                    <span class="font-bold text-gray-800">Dealer</span><span class="font-medium text-gray-500">Core</span>
                </span>
            </div>
            <div class="flex items-center gap-3 text-gray-400">
                <button class="hover:text-gray-600"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg></button>
                <div class="w-[1px] h-4 bg-gray-200"></div>
                <button class="hover:text-gray-600"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></button>
                <button class="hover:text-gray-600"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
        </div>

        <!-- Main Content: Centered Layout -->
        <div class="flex-1 flex items-center justify-center p-6 bg-gray-50">
            
            <!-- Central Card -->
            <div class="bg-white w-full max-w-sm rounded-[32px] p-8 shadow-sm border border-gray-100 flex flex-col items-center text-center">
                
                <!-- Illustration Area -->
                <div class="relative w-full mb-8">
                    <!-- This is a placeholder for your actual illustration image -->
                    <div class="bg-blue-50 rounded-full w-48 h-48 mx-auto flex items-center justify-center relative">
                        <svg class="w-24 h-24 text-blue-200" fill="currentColor" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-1 14H5V8h14v10zm-8-4h-2v-2h2v2zm0-4h-2V8h2v4z"/></svg>
                        
                        <!-- The "Red Broken Link" Circle floating on top -->
                        <div class="absolute bottom-0 translate-y-1/2 w-14 h-14 bg-red-500 rounded-full border-4 border-white shadow-lg flex items-center justify-center text-white">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                        </div>
                    </div>
                </div>

                <!-- Text Content -->
                <h2 class="text-xl font-bold text-gray-900 mb-3">Not Connected</h2>
                <p class="text-sm text-gray-500 leading-relaxed mb-8 px-4">
                    Facebook or Meta Ads Manager isn’t open. <br> Open one to continue creating ads.
                </p>

                <!-- CTA Button -->
                <button class="w-full bg-[#00a2e8] hover:bg-[#008bc9] text-white font-semibold py-3 px-6 rounded-xl flex items-center justify-center gap-2 transition-all shadow-md shadow-blue-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                    Open Meta Ads Manager
                </button>
            </div>

        </div>
    </div>

</body>
</html>
